<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techzone</title>
    
    <style>
       body{
    background-color: #050c14; 
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
}

div >img{
    box-sizing: border-box;
    width: 100px;
    height: 80px;
}


body > div{
    background-color: #0b1522; 
    border: 1px solid #142234;  
    border-radius: 15px;
    width: 500px;
    height: auto;               
    min-height: 500px;
    padding: 25px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.entrar{
    margin-top: 20px;
    border: 0px;
    border-radius: 25px;
    width: 150px;
    height: 50px;
    background-image: linear-gradient(to left bottom,#00aaff, #0077dd);
    box-shadow: 0 4px 15px rgba(0, 170, 255, 0.2); 
    display: flex;
    justify-content: center;
    align-items: center;
}

.entrar a{
    display: inline-block;
    text-decoration: none;
    color: white;
    text-align: center;
    transition: transform 0.3s ease;
}

h1,h4{
    text-align: center;
    color: white;
}

h1{
    margin-bottom: 0px;
    padding-bottom: 0px;
}

h4 {
    color: #8fa3b1; 
    font-weight: normal;
    font-size: 1rem;
    line-height: 1.5;
}

h3{
    margin: 0px;
    padding-top: 0px;
}
span,h3{
    text-align: center;
    color: #00aaff;
}

.entrar:hover{
    transform: scale(1.05);
}

.rodape{
    width: 100%;
    text-align: center;
    color: #51677a; 
    padding: 20px;
    font-size: 14px;
    margin-top: auto; 
}

.rodape p{
    display: inline;
}
.caixa-icone { 
  width: 60px; 
  height: 60px; 
  background-color: #00aaff; 
  border-radius: 12px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  margin-bottom: 25px; 
}

.raio-svg { 
  width: 35px; 
  height: 35px; 
  fill: #ffffff; 
}
    </style>
</head>
<body>
    <div>
        <div class="caixa-icone"><svg class="raio-svg" viewBox="0 0 24 24"><polygon points="13,2 4.5,13.5 11,13.5 11,22 19.5,10.5 13,10.5"/></svg></div>
        <h1>Tech<span>Zone</span></h1>
        <h3>ELETRÔNICOS & TECNOLOGIA</h3>
        <p></p>
        <h4>Bem-vindo à <span>TechZone</span> — seu destino para os melhores produtos eletrônicos com qualidade, inovação e os melhores preços do mercado.</h4>
        <div class="entrar">
            <a href="home.html"><i><b>Entrar no Site</b></i></a>
        </div>
        <footer class="rodape">
            <p>Integrantes do grupo</p>
            <br>
            <br>
            <p>Breno Marchiori |</p>
            <p> Lucas ****  </p>
            <p></p>
    </footer>
    </div>

</body>
</html>
