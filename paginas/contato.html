<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../bootstrap/bootstrap.min.js">
</head>
<body>
  <form>
  <div class="row mb-3">
    <label for="nome" class="col-sm-2 col-form-label">Nome Completo</label>
    <div class="col-sm-10">
      <input type="text" class="form-control form-control-lg" id="nome" data-bs-toggle="tooltip" title="Digite seu nome completo">
    </div>
  </div>

  <div class="row mb-3">
    <label for="cpf" class="col-sm-2 col-form-label">CPF</label>
    <div class="col-sm-10">
      <input type="text" class="form-control form-control-lg" id="cpf" data-bs-toggle="tooltip" title="Digite apenas os números do seu CPF">
    </div>
  </div>

  <div class="row mb-3">
    <label for="email" class="col-sm-2 col-form-label">E-mail</label>
    <div class="col-sm-10">
      <input type="email" class="form-control form-control-lg" id="email" data-bs-toggle="tooltip" title="Digite um e-mail válido">
    </div>
  </div>

  <div class="row mb-3">
    <label for="telefone" class="col-sm-2 col-form-label">Telefone de contato</label>
    <div class="col-sm-10">
      <input type="tel" class="form-control form-control-lg" id="telefone" data-bs-toggle="tooltip" title="Digite seu telefone com DDD">
    </div>
  </div>

  <div class="row mb-3">
    <label for="motivo" class="col-sm-2 col-form-label">Motivo do contato</label>
    <div class="col-sm-10">
      <select class="form-select form-select-lg" id="motivo" data-bs-toggle="tooltip" title="Selecione o setor responsável">
        <option selected disabled value="">Escolha uma opção...</option>
        <option value="administrativo">Administrativo</option>
        <option value="pedagogico">Pedagógico</option>
        <option value="marketing">Marketing</option>
        <option value="suporte">Suporte</option>
      </select>
    </div>
  </div>

  <div class="row mb-3">
    <label for="tipo" class="col-sm-2 col-form-label">Tipo do usuário</label>
    <div class="col-sm-10">
      <select class="form-select form-select-lg" id="tipo" data-bs-toggle="tooltip" title="Selecione seu perfil de usuário">
        <option selected disabled value="">Escolha uma opção...</option>
        <option value="aluno">Aluno</option>
        <option value="empresa">Empresa</option>
        <option value="visitante">Visitante</option>
      </select>
    </div>
  </div>

  <div class="row mb-3">
    <label for="mensagem" class="col-sm-2 col-form-label">Mensagem</label>
    <div class="col-sm-10">
      <textarea class="form-control form-control-lg" id="mensagem" rows="3" data-bs-toggle="tooltip" title="Escreva sua mensagem aqui"></textarea>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-sm-10 offset-sm-2">
      <button type="submit" class="btn btn-primary">Enviar</button>
      <button type="reset" class="btn btn-secondary">Limpar</button>
    </div>
  </div>
</form>
</body>
</html>
