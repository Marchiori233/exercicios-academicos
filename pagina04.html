<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Página04</title>
</head>
<body>
    <h1 align="center" style="font-family: arial;">Fale Conosco</h1>
    <center>
    <form action="DadosContato.html" method="get">

        <div>
            <!-- Dados pessoais -->
        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required><br><br>

        <label for="cpf">CPF:</label><br>
        <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required><br><br>

        <label for="endereco">Endereço:</label><br>
        <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required><br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required><br><br>

        <label for="data_nascimento">Data de nascimento:</label><br>
        <input type="date" id="data_nascimento" name="data_nascimento" required><br><br>
        </div>

        <div>
             <!-- Estado civil -->
            <label for="estado_civil">Estado civil:</label><br>
            <input type="radio" id="estado_civil" name="estado_civil" value="Solteiro">Solteiro(a)<br>
            <input type="radio" id="estado_civil" name="estado_civil" value="Uniao_estavel">União estavel<br>
            <input type="radio" id="estado_civil" name="estado_civil" value="Casado">Casado(a)<br>
            <input type="radio" id="estado_civil" name="estado_civil" value="Divorciado">Divorciado(a)<br>
            <input type="radio" id="estado_civil" name="estado_civil" value="Viuvo">Viúvo(a)<br>
            <input type="radio" id="estado_civil" name="estado_civil" value="Outro">Outro<br><br>
        </div>

        <div>
             <!-- Tecnologias -->
        <label for="tecnologias">Tecnologias preferidas:</label><br>
        <input id="tecnologias" type="checkbox" name="tecnologias" value="html"> HTML<br>
        <input id="tecnologias" type="checkbox" name="tecnologias" value="css"> CSS<br>
        <input id="tecnologias" type="checkbox" name="tecnologias" value="javascript"> JavaScript<br><br>
        </div>

        <div>
            <!-- Profissão -->
        Profissão:<br>
        <select name="profissao">
            <option value="">Selecione</option>
            <option value="programador">Programador</option>
            <option value="designer">Designer</option>
            <option value="analista">Analista</option>
        </select><br><br>
        </div>

        <div>
            <!-- Outros campos -->
        <label>Mensagem:</label><br>
        <textarea name="mensagem" placeholder="Digite sua mensagem"></textarea><br><br>
        
        <labe for="primeiro_emprego">Ano do primeiro emprego:</label><br>
        <input type="number" name="primeiro_emprego" id="primeiro_emprego" placeholder="Ex: 2018"><br><br>
         
        <label for="rede_social.">Rede social:</label><br>
        <input type="url" id="rede_social" name="rede_social" placeholder="https://"><br><br>
        
        <label for="senha">Senha:</label><br>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required><br><br>
        </div>
             
        <div>
            <!--Opções de enviar e limpar-->
        <input type="submit" value="Enviar">&nbsp;&nbsp;
        <input type="reset" value="Limpar">
        </div>
        
    </form>
    </center>
</body>
</html>
